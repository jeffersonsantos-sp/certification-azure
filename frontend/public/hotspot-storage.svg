<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <rect width="800" height="420" fill="#f8fafc"/>
  <text x="400" y="26" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">
    Connect the virtual machine to Azure Storage privately
  </text>

  <rect x="40" y="120" width="220" height="180" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="150" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#075985">Virtual network</text>
  <text x="150" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0369a1">Subnet: app</text>
  <rect x="75" y="215" width="150" height="52" rx="8" fill="#ffffff" stroke="#38bdf8"/>
  <text x="150" y="247" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">Virtual machine</text>

  <rect x="540" y="120" width="220" height="180" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">Azure Storage</text>
  <text x="650" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#15803d">Storage account</text>
  <rect x="575" y="215" width="150" height="52" rx="8" fill="#ffffff" stroke="#4ade80"/>
  <text x="650" y="247" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">Blob container</text>

  <line x1="260" y1="210" x2="300" y2="210" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="500" y1="210" x2="540" y2="210" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>

  <rect x="300" y="40" width="200" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Public endpoint</text>

  <rect x="300" y="120" width="200" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="156" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Service endpoint</text>

  <rect x="300" y="200" width="200" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="236" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Private endpoint</text>

  <rect x="300" y="280" width="200" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="316" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Azure Firewall</text>
</svg>
