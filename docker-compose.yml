services:
  frontend:
    image: updateinformatica/az104-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID:-}
        VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID:-}
        VITE_AZURE_REDIRECT_URI: ${VITE_AZURE_REDIRECT_URI:-}
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    image: updateinformatica/az104-backend:latest
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/az104_trainer
      - REDIS_URL=redis://redis:6379/0
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_TENANT_ALLOWLIST=${AZURE_TENANT_ALLOWLIST:-}
      - AZURE_SUBSCRIPTION_ALLOWLIST=${AZURE_SUBSCRIPTION_ALLOWLIST:-}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - ./questions:/app/questions
      - ./scripts:/app/scripts
      - ./labs:/app/labs

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: az104_trainer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
